[package]
name = "tollgate"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A manifest-driven x402 paywall for HTTP APIs: serve any endpoint behind HTTP 402, settled on the Kite chain."
license = "Apache-2.0"
repository = "https://github.com/pristinecake/tollgate"
readme = "README.md"
keywords = ["x402", "payments", "http", "kite", "proxy"]
categories = ["web-programming::http-server", "finance"]
exclude = ["schema/", "scripts/", "package-lock.json"]

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "charset", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "charset"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
wiremock = "0.6.5"

# A paywall is on the hot path of every paid request. Optimise for the request
# rather than for the build.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"
